name: sismod-antivirus

services:
  clamav:
    image: clamav/clamav@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_definitions:/var/lib/clamav
    mem_limit: 3g

volumes:
  clamav_definitions:
