name: sismod-homologacao

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sismod
      POSTGRES_USER: sismod
      POSTGRES_PASSWORD: ${SISMOD_DB_PASSWORD:?Defina SISMOD_DB_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sismod"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${SISMOD_STORAGE_ACCESS_KEY:?Defina SISMOD_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${SISMOD_STORAGE_SECRET_KEY:?Defina SISMOD_STORAGE_SECRET_KEY}
    volumes: [minio_data:/data]
    ports: ["127.0.0.1:9001:9001"]

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done; mc mb --ignore-existing local/sismod-media; mc anonymous set none local/sismod-media"]
    environment:
      MINIO_ROOT_USER: ${SISMOD_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${SISMOD_STORAGE_SECRET_KEY}

  mqtt:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    environment:
      SISMOD_MQTT_CONSUMER_PASSWORD: ${SISMOD_MQTT_CONSUMER_PASSWORD:?Defina SISMOD_MQTT_CONSUMER_PASSWORD}
      SISMOD_MQTT_PUBLISHER_PASSWORD: ${SISMOD_MQTT_PUBLISHER_PASSWORD:?Defina SISMOD_MQTT_PUBLISHER_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp /mosquitto/source/acl.conf /mosquitto/data/acl.conf && mosquitto_passwd -b -c /mosquitto/data/passwords sismod-consumer $$SISMOD_MQTT_CONSUMER_PASSWORD && mosquitto_passwd -b /mosquitto/data/passwords sismod-publisher $$SISMOD_MQTT_PUBLISHER_PASSWORD && chown mosquitto:mosquitto /mosquitto/data/acl.conf /mosquitto/data/passwords && chmod 600 /mosquitto/data/acl.conf /mosquitto/data/passwords && exec mosquitto -c /mosquitto/source/mosquitto.conf"]
    ports: ["127.0.0.1:1883:1883"]
    volumes:
      - mosquitto_data:/mosquitto/data
      - ./mosquitto/mosquitto.conf:/mosquitto/source/mosquitto.conf:ro
      - ./mosquitto/acl.conf:/mosquitto/source/acl.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -u sismod-consumer -P $$SISMOD_MQTT_CONSUMER_PASSWORD -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:1.20.1
    restart: unless-stopped
    profiles: ["livestream-local", "livestream-demo"]
    volumes:
      - ./mediamtx/mediamtx.local.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:1935:1935"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:8189:8189/udp"
      - "127.0.0.1:9997:9997"

  livestream-demo:
    image: jrottenberg/ffmpeg:7.1-alpine
    restart: unless-stopped
    profiles: ["livestream-demo"]
    command:
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=1280x720:rate=30
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -f
      - flv
      - rtmp://mediamtx/00000000-0000-4000-8000-000000000001
    depends_on: [mediamtx]

  web:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      SISMOD_DB_HOST: db
      SISMOD_MEDIA_STORAGE: minio
      SISMOD_STORAGE_ENDPOINT_URL: http://minio:9000
      DJI_CLOUD_MQTT_HOST: tcp://mqtt:1883
      SISMOD_MEDIAMTX_API_URL: http://mediamtx:9997
    command: ["/bin/sh", "-c", "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  dock-consumer:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      SISMOD_DB_HOST: db
      SISMOD_MEDIA_STORAGE: minio
      SISMOD_STORAGE_ENDPOINT_URL: http://minio:9000
      DJI_CLOUD_MQTT_HOST: tcp://mqtt:1883
      DJI_DOCK_MQTT_USERNAME: sismod-consumer
      DJI_DOCK_MQTT_PASSWORD: ${SISMOD_MQTT_CONSUMER_PASSWORD}
    command: ["python", "manage.py", "consumir_dji_dock"]
    profiles: ["dock-real"]
    depends_on: [web, mqtt]

  drc-watchdog:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      SISMOD_DB_HOST: db
      SISMOD_MEDIA_STORAGE: minio
      SISMOD_STORAGE_ENDPOINT_URL: http://minio:9000
    command: ["/bin/sh", "-c", "while true; do python manage.py encerrar_sessoes_drc; sleep 1; done"]
    depends_on:
      db: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

volumes:
  postgres_data:
  minio_data:
  mosquitto_data:
