name: sismod-homologacao

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sismod
      POSTGRES_USER: sismod
      POSTGRES_PASSWORD: ${SISMOD_DB_PASSWORD:?Defina SISMOD_DB_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sismod"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${SISMOD_STORAGE_ACCESS_KEY:?Defina SISMOD_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${SISMOD_STORAGE_SECRET_KEY:?Defina SISMOD_STORAGE_SECRET_KEY}
    volumes: [minio_data:/data]
    ports: ["127.0.0.1:9001:9001"]

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done; mc mb --ignore-existing local/sismod-media; mc anonymous set none local/sismod-media"]
    environment:
      MINIO_ROOT_USER: ${SISMOD_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${SISMOD_STORAGE_SECRET_KEY}

  mqtt:
    image: emqx/emqx:6.2.3
    restart: unless-stopped
    environment:
      EMQX_ALLOW_ANONYMOUS: "true"
    ports: ["127.0.0.1:18083:18083"]
    volumes: [emqx_data:/opt/emqx/data]

  web:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      SISMOD_DB_HOST: db
      SISMOD_MEDIA_STORAGE: minio
      SISMOD_STORAGE_ENDPOINT_URL: http://minio:9000
      DJI_CLOUD_MQTT_HOST: tcp://mqtt:1883
    command: ["/bin/sh", "-c", "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  dock-consumer:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      SISMOD_DB_HOST: db
      SISMOD_MEDIA_STORAGE: minio
      SISMOD_STORAGE_ENDPOINT_URL: http://minio:9000
      DJI_CLOUD_MQTT_HOST: tcp://mqtt:1883
    command: ["python", "manage.py", "consumir_dji_dock"]
    profiles: ["dock-real"]
    depends_on: [web, mqtt]

volumes:
  postgres_data:
  minio_data:
  emqx_data:
