{% extends "base.html" %}
{% block content %}
<div class="page-header"><div><h1>Confirmar ação crítica</h1><p>Informe novamente sua senha antes de autorizar a operação.</p></div></div>
<section class="panel" style="max-width:560px;margin:auto"><div class="alert alert-warning">Esta confirmação não remove as travas técnicas e não publica o comando por si só.</div><form method="post">{% csrf_token %}<div class="form-group"><label>Senha atual</label><input class="form-control" type="password" name="senha" autocomplete="current-password" autofocus required></div><button class="btn btn-primary" type="submit">Confirmar identidade</button></form></section>
{% endblock %}
