{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selecionar perfil - Gestão de Drones</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/sistema.css' %}?v=5">
</head>
<body class="login-page">
<div class="login-card" style="max-width: 620px;">
    <div class="login-brand">✈</div>
    <h1>Como deseja entrar?</h1>
    <p>Escolha o perfil que será usado nesta sessão.</p>
    {% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% endif %}
    <form method="post" class="d-grid gap-3">{% csrf_token %}
        <button class="btn btn-primary p-3" type="submit" name="modo" value="admin">
            <strong>Entrar como administrador</strong><br><small>Visualizar e gerenciar os dados de todos os usuários.</small>
        </button>
        <button class="btn btn-light p-3" type="submit" name="modo" value="usuario" {% if not possui_perfil_usuario %}disabled{% endif %}>
            <strong>Entrar como usuário</strong><br><small>Usar somente sua agenda, seus voos e seus dados.</small>
        </button>
    </form>
</div>
</body>
</html>
