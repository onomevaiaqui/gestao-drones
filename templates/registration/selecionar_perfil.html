{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selecionar perfil - SISMOD</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/sistema.css' %}?v=20">
</head>
<body class="profile-choice-page">
<main class="profile-choice-card">
    <div class="profile-choice-brand">SISMOD</div>
    <h1>Como deseja entrar?</h1>
    <p>Escolha o perfil que será usado nesta sessão.</p>
    {% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% endif %}
    <form method="post" class="profile-choice-actions">{% csrf_token %}
        <button class="profile-choice-option primary" type="submit" name="modo" value="admin">
            <strong>Entrar como administrador</strong><br><small>Visualizar e gerenciar os dados de todos os usuários.</small>
        </button>
        <button class="profile-choice-option" type="submit" name="modo" value="usuario" {% if not possui_perfil_usuario %}disabled{% endif %}>
            <strong>Entrar como usuário</strong><br><small>Usar somente sua agenda, seus voos e seus dados.</small>
        </button>
    </form>
</main>
</body>
</html>
