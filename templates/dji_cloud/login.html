{% load static %}
<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SISMOD no DJI Pilot 2</title><link rel="stylesheet" href="{% static 'css/sistema.css' %}?v=31"></head>
<body class="dji-pilot-page"><main class="dji-pilot-card"><strong class="dji-pilot-brand">SISMOD</strong><h1>Conectar DJI Pilot 2</h1><p>Use a mesma conta do SISMOD atribuída ao piloto.</p><form method="post">{% csrf_token %}<label>Usuário</label><input class="form-control" name="username" autocomplete="username" required autofocus><label>Senha</label><input class="form-control" type="password" name="password" autocomplete="current-password" required>{% if form.errors %}<div class="alert alert-danger">Usuário ou senha inválidos.</div>{% endif %}<button class="btn btn-primary" type="submit">Entrar e conectar</button></form></main></body></html>
